<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="home-button">
            <img src="home.png" alt="Back to Homepage">
        </a>

        <span class="header-title">Flower Clicker</span>

    </header>


    <main class="game-container">


        <section class="flower-section">
            <button id="flowerButton">Click me!</button>
            <div id="flowerDisplay">You have 0 petals.</div>
        </section>

        <section class="shop-section">
            <h2>Shop</h2>
            <button type="button" id="upgradeClicker">Upgrade clicker for 25 petals.</button>
            <button type="button" id="autoClicker">Purchase autoclicker for 15 petals.</button>
        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
